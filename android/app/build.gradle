plugins {
    id 'com.android.application'
}

android {
    namespace 'gt.madretierra.mapas'
    compileSdk 34

    defaultConfig {
        applicationId "gt.madretierra.mapas"
        // Android 5.0 en adelante: cubre prácticamente cualquier teléfono
        // que siga en uso. Más atrás que eso ya no recibe ni parches de
        // seguridad y el navegador de adentro no sirve.
        minSdk 21
        targetSdk 34

        // Suben solos en cada compilación (ver el flujo de GitHub).
        versionCode project.hasProperty('codigoVersion') ? codigoVersion.toInteger() : 1
        versionName project.hasProperty('nombreVersion') ? nombreVersion : '1.0'
    }

    signingConfigs {
        release {
            // Los datos de la firma llegan desde GitHub como secretos.
            // Sin ellos se compila igual, pero sin firmar.
            if (project.hasProperty('almacenFirma')) {
                storeFile file(almacenFirma)
                storePassword claveAlmacen
                keyAlias aliasFirma
                keyPassword claveClave
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('almacenFirma')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // El BOM alinea todas las piezas de la biblioteca de Kotlin en una sola
    // version. Hace falta porque appcompat y activity arrastran
    // kotlin-stdlib 1.8.22, y de la 1.8 en adelante esa pieza ya trae
    // adentro lo que antes venia aparte en kotlin-stdlib-jdk7 y -jdk8. Sin
    // alinearlas entran las dos, con las mismas clases dentro, y la
    // compilacion se cae en checkReleaseDuplicateClasses.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
}
